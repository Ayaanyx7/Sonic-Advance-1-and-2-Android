name: Build Sonic Advance 1 Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Native Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev xorg-dev libsdl2-dev
      # Setting up Android SDK & NDK environments
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
      - name: Pre-build stub Chao Garden asset (placeholder, non-GBA platforms only)
        run: |
          make tools
          make PLATFORM=android chao_garden/mb_chao_garden.gba.lz
      - name: Fetch SDL2 source for Android build
        run: |
         curl -L https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.tar.gz -o SDL2.tar.gz
         mkdir -p android-project/app/jni/SDL
         tar -xzf SDL2.tar.gz -C android-project/app/jni/SDL --strip-components=1
      # STAGE 1: Explicitly pass NDK cross-compilers to the Makefile
      - name: Compile Game Assets and Native Tools
        run: |
          export NDK_TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          make android GAME_NAME=sa1 GAME_REGION=USA PORTABLE=1 \
            CC=$NDK_TOOLCHAIN/armv7a-linux-androideabi24-clang \
            CXX=$NDK_TOOLCHAIN/armv7a-linux-androideabi24-clang++ \
            AR=$NDK_TOOLCHAIN/llvm-ar \
            STRIP=$NDK_TOOLCHAIN/llvm-strip

      - name: Diagnose sound PIC relocations
        run: |
          echo "=== Finding libsa2_game.a ==="
          find . -name "libsa2_game.a" -print

          echo "=== Inspecting archive members ==="
          LIB=$(find . -name "libsa2_game.a" -print -quit)
          echo "Using: $LIB"

          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar t "$LIB" \
            | grep -E 'sound_data|mus_game_over|se_144|se_145|voice__announcer' \
            | head -100

          echo "=== Extracting relevant objects ==="
          mkdir -p /tmp/sound-debug
          cd /tmp/sound-debug
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar x "$GITHUB_WORKSPACE/$LIB" \
            sound_data.o mus_game_over.o se_144.o se_145.o \
            voice__announcer__tails.o voice__announcer__sonic.o \
            voice__announcer__sonic_advance_2.o \
            voice__announcer__knuckles.o \
            voice__announcer__go.o \
            voice__announcer__cream.o 2>/dev/null || true

          echo "=== Relocations ==="
          for f in *.o; do
            echo "----- $f -----"
            $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -r "$f" \
              | grep -E 'ABS64|voicegroup|R_AARCH64' || true
          done
          
      - name: Build libagbsyscall
        run: |
         cd libagbsyscall
         make clean || true
         make PLATFORM=android
         echo "=== Libraries ==="
         find . -name "*.a"
            
      # STAGE 2: Pass everything to Gradle to package the APK
      - name: Make Gradle Wrapper Executable
        run: chmod +x android-project/gradlew
        continue-on-error: true

                  # STAGE 2: Flatten paths, kill persistent cache, and pass to Gradle
      - name: Flatten Bios Emulation Code Paths
        run: |
          # Force delete Android Studio's rigid, hidden C++ build cache directories
          rm -rf android-project/app/.cxx/
          rm -rf android-project/app/build/
          rm -rf android-project/.gradle/
      - name: Package Android APK via Gradle
        working-directory: ./android-project
        run: |
          ./gradlew assembleRelease --no-build-cache
      # STAGE 3: Extract the finished installation file out of GitHub Actions
      - name: Upload Completed Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sonic-advance-1-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
