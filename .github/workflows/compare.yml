name: Compare against old SA1 port

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          path: new

      - name: Checkout old known-good SA1 branch
        uses: actions/checkout@v4
        with:
          repository: Ayaanyx7/old-sa1-and-2-port
          ref: Sa1-main
          path: old

      - name: Whole-repo file list
        run: |
          cd "$GITHUB_WORKSPACE"
          diff -rq -x .git -x build -x ext -x android-project -x .github -x netlink -x rom_verify old new || true

      - name: Diffs of the files that matter for SA1
        run: |
          cd "$GITHUB_WORKSPACE"
          for f in Makefile src/lib/m4a/m4a.c src/platform/pret_sdl/sdl2.c; do
            echo "=================== $f ==================="
            { diff -u old/$f new/$f || true; } | head -400
          done
